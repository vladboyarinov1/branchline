<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Branchline — нативный Git-клиент для Mac. Ветки, история коммитов, сравнение файлов и терминал.">
  <meta name="theme-color" content="#f1f4f9">
  <title>Branchline — Git для macOS</title>
  <link rel="icon" href="./assets/branchline-icon.png" type="image/png">
  <link rel="stylesheet" href="./site.css">
  <script src="./release.js" defer></script>
</head>
<body>
  <main class="page">
    <div class="masthead">
      <div class="brand">
        <img src="./assets/branchline-icon.png" width="36" height="36" alt="">
        <span>Branchline</span>
      </div>
      <a class="source-link" href="https://github.com/vladboyarinov1/branchline">GitHub</a>
    </div>

    <section class="hero" aria-labelledby="headline">
      <div class="intro">
        <h1 id="headline">Git для macOS</h1>
        <p class="description">Смотрите историю веток, сравнивайте изменения и делайте коммиты в нативном приложении для Mac.</p>
        <div class="download">
          <button class="download-button" type="button" id="download-pending" disabled>Скачать для macOS</button>
          <a class="download-button" id="download-link" hidden>Скачать для macOS</a>
          <p class="compatibility" id="compatibility">macOS 14+ · Apple Silicon и Intel</p>
          <p class="availability" id="release-status" role="status">Загрузка откроется после первого подписанного релиза.</p>
        </div>
      </div>

      <figure class="preview">
        <img class="app-window" src="./assets/branchline-window.webp"
          width="1904" height="1134" fetchpriority="high"
          alt="Branchline показывает список изменённых файлов, сравнение кода и историю коммитов в демонстрационном проекте.">
      </figure>
    </section>
  </main>
</body>
</html>
