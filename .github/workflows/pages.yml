name: Download page

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
  workflow_call:

permissions: {}
concurrency:
  group: branchline-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Prepare page and stable update feed
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir _site
          cp -R docs/. _site/
          tag=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '[.[] | select(.draft == false and .prerelease == false)][0].tag_name // empty')
          if [[ -n $tag ]]; then
            gh release download "$tag" --pattern appcast.xml --pattern release.json --dir _site --clobber
            jq -e --arg tag "$tag" --arg repo "$GITHUB_REPOSITORY" \
              '.version == ($tag | ltrimstr("v")) and
               .downloadUrl == ("https://github.com/" + $repo + "/releases/download/" + $tag + "/Branchline.dmg")' \
              _site/release.json >/dev/null
          fi
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
